name: PR

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.27"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - name: Repository policy and pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/policy_check.py --pr-title "$PR_TITLE"
      - run: TOOLS_DIR="$RUNNER_TEMP/bin" ./scripts/install_tools.sh
      - name: Workflow lint
        run: '"$RUNNER_TEMP/bin/actionlint" -color'
      - name: Workflow security audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --persona auditor .github
      - name: Secret scan (full history)
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner .'

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format github .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run deptry src
      - run: uv run pytest --cov --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - run: uv run python scripts/check_coverage.py coverage.json
      - name: Changed-line coverage
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=95
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: python-coverage-${{ github.event.pull_request.number }}
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run mutmut run
      - run: uv run mutmut results --all true | uv run python scripts/check_mutation.py

  python-dependencies:
    name: python-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - name: Known vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Licences
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt \
            | uv run python scripts/check_licenses.py

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm knip
      - run: pnpm build

  web-dependencies:
    name: web-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - name: Licences
        run: pnpm licenses list --prod --json | uv run --locked --project .. python ../scripts/check_licenses.py --pnpm

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: ./scripts/check_reproducible.sh
