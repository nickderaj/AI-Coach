# The coach's Hermes profile, installed as <data dir>/hermes/config.yaml by
# deploy/install.sh on every install (edits on the host are overwritten).
# ${...} values come from trainer-coach.service, which takes them from
# deploy/local.env; the two API keys come from the root-only secrets
# (deploy/hermes-secrets.sh). Nothing here is host-specific or personal.

# The model: an OpenAI-compatible provider (D13), reached as a custom provider.
model:
  provider: trainer-model
  default: ${TRAINER_MODEL}
providers:
  trainer-model:
    api: ${TRAINER_MODEL_URL}
    key_env: TRAINER_MODEL_API_KEY
    # The provider lists hundreds of models; only the configured one is used.
    discover_models: false
    models:
      - ${TRAINER_MODEL}

# What the coach can do. Learning is on from day one (D11): memory, skills and
# session search. It has no terminal, files, web, browser or code execution:
# training facts reach it only through the trainer's MCP tools (D10).
toolsets: [memory, session_search, skills, todo, clarify, mcp-trainer]
platform_toolsets:
  api_server: [memory, session_search, skills, todo, clarify, mcp-trainer]
agent:
  # Belt and braces: removed everywhere, whatever a platform lists.
  disabled_toolsets:
    - terminal
    - file
    - web
    - browser
    - code_execution
    - vision
    - image_gen
    - delegation
    - cronjob
    - connections
tools:
  # Every allowed tool is shown to the model directly; no search-and-call bridge.
  tool_search:
    enabled: "off"
security:
  # The installed Hermes is fixed and root-owned: never pip-install at runtime.
  allow_lazy_installs: false

# The trainer's tool server (python -m trainer.mcp): Hermes starts it as a child
# process and talks to it over stdin and stdout. It reads the training log
# read-only. Tools only: no resources, prompts or sampling.
# It proposes programs through the API on loopback, with the gateway's own key
# (the API accepts it for that alone). Hermes gives a stdio server only this env
# and a safe baseline, and writes the ${...} names, never their values, back to
# this file.
mcp_servers:
  trainer:
    command: ${TRAINER_PREFIX}/venv/bin/python
    args: [-m, trainer.mcp]
    env:
      TRAINER_DATA_DIR: ${TRAINER_DATA_DIR}
      TRAINER_API_URL: ${TRAINER_API_URL}
      TRAINER_COACH_KEY: ${API_SERVER_KEY}
    timeout: 30
    tools:
      resources: false
      prompts: false
    sampling:
      enabled: false

# The web app's Coach tab talks to this, through the API, on loopback only: the
# API's own address (TRAINER_BIND_HOST, validated as loopback), so the API and
# the installer find the gateway where it listens.
gateway:
  api_server:
    enabled: true
    host: ${TRAINER_HERMES_HOST}
    port: ${TRAINER_HERMES_PORT}
